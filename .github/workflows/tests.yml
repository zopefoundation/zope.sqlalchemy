# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/zope-product
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 0'  # run once a week on Sunday
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    strategy:
      # We want to see all failures:
      fail-fast: false
      matrix:
        os:
        - ["ubuntu", "ubuntu-latest"]
        config:
        # [Python version, tox env]
        - ["3.11", "release-check"]
        - ["3.11", "py311"]
        - ["3.12", "py312"]
        - ["3.13", "py313"]
        - ["3.14", "py314"]
        - ["3.15", "py315"]
        - ["3.11", "coverage"]

    runs-on: ${{ matrix.os[1] }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    name: ${{ matrix.config[1] }}
    steps:
    - name: "Configure PostgreSQL"
      run: |
        sudo mkdir -p /usr/local/pgsql/data
        sudo chown postgres /usr/local/pgsql/data
        PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
        sudo su - postgres -c "$PGBIN/initdb -D /usr/local/pgsql/data"
        sudo su - postgres -c 'echo "max_prepared_transactions=10" >> /usr/local/pgsql/data/postgresql.conf'
        sudo su - postgres -c 'cat /usr/local/pgsql/data/postgresql.conf'
        sudo su - postgres -c "$PGBIN/pg_ctl -D /usr/local/pgsql/data -l logfile start"
        sudo su - postgres -c "$PGBIN/createdb zope_sqlalchemy_tests"
        sudo su - postgres -c "$PGBIN/psql -l"
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv + caching
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          setup.*
          tox.ini
        python-version: ${{ matrix.config[0] }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Test
      run: |
        uvx --with tox-uv tox -f ${{ matrix.config[1] }}
    - name: Coverage
      if: matrix.config[1] == 'coverage'
      run: |
        uvx coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build package artifacts
      if: >
        matrix.os[0] == 'ubuntu'
        && matrix.config[1] == 'py315'
      run: |
        rm -f dist/*
        pip install -U packaging "setuptools >= 78.1.1,< 82" wheel twine
        python setup.py sdist
        python setup.py bdist_wheel

    - name: Upload package wheel
      if: >
        matrix.os[0] == 'ubuntu'
        && matrix.config[1] == 'py315'
      uses: actions/upload-artifact@v7
      with:
        name: zope.sqlalchemy.whl
        path: dist/*whl

    - name: Upload package source distribution
      if: >
        matrix.os[0] == 'ubuntu'
        && matrix.config[1] == 'py315'
      uses: actions/upload-artifact@v7
      with:
        name: zope.sqlalchemy.tar.gz
        path: dist/*gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # Only publish on tag pushes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    # Wait for build jobs to complete
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/zope.sqlalchemy
    permissions:
      contents: read
      id-token: write  # Mandatory for trusted publishing

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: '*'
          merge-multiple: true

      - name: Display structure of downloaded files
        run: |
          ls -lR dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true
          packages-dir: dist/
          verbose: true
