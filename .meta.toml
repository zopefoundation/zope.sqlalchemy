# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/zope-product
[meta]
template = "zope-product"
commit-id = "52a3ad89"

[python]
with-pypy = false
with-sphinx-doctests = false
with-windows = false
with-future-python = false
with-macos = false
with-docs = false
with-free-threaded-python = false

[coverage]
fail-under = 95
combine = true

[tox]
additional-envlist = [
    "py{311,312,313,314,315}-sqlalchemy{14,20,21}",
]
testenv-deps = [
    "coverage[toml]",
    "sqlalchemy14: SQLAlchemy==1.4.*",
    "sqlalchemy20: SQLAlchemy==2.0.*",
    "sqlalchemy21: SQLAlchemy==2.1.*",
]
testenv-commands-pre = [
    "sqlalchemy14: sh -c 'if [ '{env:CI:false}' = 'true' ]; then {envbindir}/buildout -nc {toxinidir}/github_actions.cfg buildout:directory={envdir} buildout:develop={toxinidir} ; fi'",
    "!sqlalchemy14: sh -c 'if [ '{env:CI:false}' = 'true' ]; then {envbindir}/buildout -nc {toxinidir}/github_actions20.cfg buildout:directory={envdir} buildout:develop={toxinidir} ; fi'",
    "sqlalchemy14: sh -c 'if [ '{env:CI:false}' != 'true' ]; then {envbindir}/buildout -nc {toxinidir}/postgres.cfg buildout:directory={envdir} buildout:develop={toxinidir} ; fi'",
    "!sqlalchemy14: sh -c 'if [ '{env:CI:false}' != 'true' ]; then {envbindir}/buildout -nc {toxinidir}/postgres20.cfg buildout:directory={envdir} buildout:develop={toxinidir} ; fi'",
]
testenv-commands = [
    "coverage run {envbindir}/test {posargs:-cv}",
    "sh -c 'if [ '{env:TEST_PG:{env:CI:false}}' = 'true' ]; then coverage run -a {envbindir}/testpg {posargs:-cv} ; fi'",
    "sh -c 'if [ '{env:TEST_PG:{env:CI:false}}' = 'true' ]; then coverage run -a {envbindir}/testpg2 {posargs:-cv} ; fi'",
    "!sqlalchemy14: sh -c 'if [ '{env:TEST_PG:{env:CI:false}}' = 'true' ]; then coverage run -a {envbindir}/testpg3 {posargs:-cv} ; fi'",
    "!sqlalchemy14: sh -c 'if [ '{env:TEST_PG:{env:CI:false}}' = 'true' ]; then coverage run -a {envbindir}/testpg32 {posargs:-cv} ; fi'",
]
coverage-additional = [
    "commands_pre =",
]
testenv-additional = [
    "passenv =",
    "    CI",
    "    TEST_PG",
    "allowlist_externals =",
    "    sh",
]

[manifest]
additional-rules = [
    "include github_actions.cfg",
    "include github_actions20.cfg",
    "include mysql.cfg",
    "include oracle.cfg",
    "include postgres.cfg",
    "include postgres20.cfg",
    "include pysqlite.cfg",
    "recursive-include src *.rst",
]

[github-actions]
steps-before-checkout = [
    "- name: \"Configure PostgreSQL\"",
    "  run: |",
    "    sudo mkdir -p /usr/local/pgsql/data",
    "    sudo chown postgres /usr/local/pgsql/data",
    "    PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)",
    "    sudo su - postgres -c \"$PGBIN/initdb -D /usr/local/pgsql/data\"",
    "    sudo su - postgres -c 'echo \"max_prepared_transactions=10\" >> /usr/local/pgsql/data/postgresql.conf'",
    "    sudo su - postgres -c 'cat /usr/local/pgsql/data/postgresql.conf'",
    "    sudo su - postgres -c \"$PGBIN/pg_ctl -D /usr/local/pgsql/data -l logfile start\"",
    "    sudo su - postgres -c \"$PGBIN/createdb zope_sqlalchemy_tests\"",
    "    sudo su - postgres -c \"$PGBIN/psql -l\"",
]
test-commands = [
    "uvx --with tox-uv tox ${{ matrix.config[1] == 'coverage' && '--skip-env \"(lint|release-check)\"' || format('-f {0}', matrix.config[1]) }}",
]

[pypi]
trusted-publishing = true
